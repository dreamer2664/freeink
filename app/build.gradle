apply plugin: 'com.android.application'
android {
    namespace 'app.freeink'
    compileSdk 34
    defaultConfig {
        applicationId 'app.freeink'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }
    buildTypes { release { minifyEnabled false } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { /* Intentionally none: Android framework only — fast, private, offline. */ }
