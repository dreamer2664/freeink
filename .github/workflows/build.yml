name: Build APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install SDK platform 34
        run: yes | "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" "platforms;android-34" "build-tools;34.0.0" || sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Build
        run: bash scripts/build-apk.sh
      - name: Test
        run: python3 tests/run_tests.py
      - uses: actions/upload-artifact@v4
        with: { name: FreeInk-apk, path: dist/FreeInk.apk }
